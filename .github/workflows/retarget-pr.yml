# main only receives releases from develop. Any other PR opened against
# main is moved to develop automatically and a comment explains why.
name: Retarget PRs to develop

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  retarget:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Change base to develop
        run: gh pr edit "$PR" --repo "$REPO" --base develop
      - name: Explain
        run: >
          gh pr comment "$PR" --repo "$REPO" --body
          "Base branch changed from \`main\` to \`develop\`. \`main\` only receives releases merged from \`develop\`."
