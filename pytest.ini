[pytest]
markers =
    slow: tests lentos que cargan el modelo real (deseleccionar con -m "not slow")
    lenta: usa servicios reales con la cuenta del usuario (publicar en redes); solo con -m lenta
testpaths = tests
# Los tests `lenta` nunca corren por defecto: `-m lenta` en la línea de órdenes
# sustituye a este filtro.
addopts = -m "not lenta"
